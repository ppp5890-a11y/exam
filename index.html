<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考卷</title>
  <style>
    body { font-family: sans-serif; background: #f3f4f6; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 20px; }
    .header { background: #3b82f6; color: white; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
    .q-box { background: #f9fafb; border: 2px solid #e5e7eb; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .badge { background: #3b82f6; color: white; font-size: 12px; padding: 2px 6px; border-radius: 4px; margin-right: 8px; }
    .blank-input { width: 60px; height: 28px; text-align: center; border: 2px solid #86efac; border-radius: 4px; }
    .name-input { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; border: 1px solid #d1d5db; border-radius: 6px; margin-bottom: 20px; }
    .explain { display: none; margin-top: 12px; padding: 10px; background: #eff6ff; border-radius: 6px; }
    .btn-submit { background: #2563eb; color: white; padding: 12px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; }
    .score-board { display: none; text-align: center; font-size: 22px; font-weight: bold; color: #dc2626; background: #fef2f2; padding: 15px; border-radius: 8px; }
    .status { text-align: center; margin-top: 12px; font-size: 15px; }
    .correct-q { border-color: #22c55e !important; }
    .wrong-q { border-color: #ef4444 !important; }
    .input-wrong { border-color: #ef4444 !important; background: #fee2e2 !important; }
    .input-correct { border-color: #22c55e !important; background: #dcfce7 !important; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header"><h1 id="exam-title">載入中...</h1></div>
    <form id="quiz-form">
      <input id="student-name" class="name-input" placeholder="請輸入你的名字" required>
      <div id="questions-container"></div>
      <div id="score-board" class="score-board"></div>
      <div id="status" class="status"></div>
      <button type="submit" id="submit-btn" class="btn-submit" style="margin-top:20px;">繳交考卷</button>
    </form>
  </div>

  <script>
    // ===== 1. 只需要改這一行：貼上你的 Project URL =====
    // 在 Supabase：Project Settings → API → Project URL（格式：https://xxxxxxxx.supabase.co）
    const SUPABASE_URL = 'https://kxrtesreuuaumdikeqrv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_1NB_TggvO0cURnJaIT7D6g_791CoJLD';

    // ===== 2. 題庫（key 要和 parent.html 產生的 exam_id 一致）=====
    const EXAMS = {
      g3_math_unit_01: {
        title: "三年級數學 - 綜合單元測驗",
        questions: [
          { id: 1, question: "15 減 3 是多少？再加 5 是多少？", guide_template: "第一步： 15 - 3 = [blank] ； 第二步： [blank] + 5 = [blank]", correct_answer: ["12", "12", "17"], explain: "15 - 3 = 12，12 + 5 = 17。" }
        ]
      },
      g3_math_unit_02: {
        title: "三年級數學 - 分數與小數大小比較",
        questions: [
          { id: 1, question: "在 □ 填入 >、< 或 =：", guide_template: "0.6 [blank] 0.58", correct_answer: [">"], explain: "0.6 = 0.60，比 0.58 大。" },
          { id: 2, question: "在 □ 填入 >、< 或 =：", guide_template: "3/5 [blank] 4/5", correct_answer: ["<"], explain: "分母相同，分子越大分數越大。" }
        ]
      }
    };

    const examId = new URLSearchParams(location.search).get('exam_id') || 'g3_math_unit_01';
    const examData = EXAMS[examId];
    const container = document.getElementById('questions-container');
    const statusEl = document.getElementById('status');

    if (!examData) {
      document.getElementById('exam-title').innerText = "找不到這份考卷";
      document.getElementById('quiz-form').style.display = 'none';
    } else {
      document.getElementById('exam-title').innerText = examData.title;
      examData.questions.forEach((q, index) => {
        const qDiv = document.createElement('div');
        qDiv.className = "q-box";
        qDiv.id = `q-box-${q.id}`;
        let blankIndex = 0;
        const tpl = q.guide_template.replace(/\[blank\]/g, () =>
          `<input type="text" name="q-${q.id}[]" class="blank-input" required data-blank="${blankIndex++}" autocomplete="off" />`);
        qDiv.innerHTML =
          `<div><span class="badge">第 ${index + 1} 題</span><b>${q.question}</b></div><br>` +
          `<div style="line-height:2;">${tpl}</div>` +
          `<div id="explain-${q.id}" class="explain"><b>解析：</b>${q.explain || ''}</div>`;
        container.appendChild(qDiv);
      });
    }

    // 上傳成績：會真的檢查回應，失敗時顯示原因
    async function uploadResultToCloud(payload) {
      statusEl.style.color = '#374151';
      statusEl.innerText = '成績上傳中...';
      try {
        const res = await fetch(SUPABASE_URL + '/rest/v1/exam_results', {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify(payload)
        });
        if (!res.ok) {
          const detail = await res.text();
          throw new Error('HTTP ' + res.status + ' ' + detail);
        }
        statusEl.style.color = '#16a34a';
        statusEl.innerText = '🎉 成績已回傳給家長囉！';
      } catch (err) {
        statusEl.style.color = '#dc2626';
        statusEl.innerText = '回傳失敗：' + err.message;
        console.error(err);
      }
    }

    // 批改：每一題各自判斷；整份分數 = 答對題數 / 總題數
    document.getElementById('quiz-form').addEventListener('submit', function (e) {
      e.preventDefault();
      let correctCount = 0;
      const historyAnswers = {};

      examData.questions.forEach((q) => {
        const qBox = document.getElementById(`q-box-${q.id}`);
        const inputs = document.querySelectorAll(`input[name="q-${q.id}[]"]`);
        let qCorrect = true;
        const given = [];

        inputs.forEach((input, i) => {
          const val = input.value.trim();
          given.push(val);
          const ok = val === q.correct_answer[i];
          input.className = 'blank-input ' + (ok ? 'input-correct' : 'input-wrong');
          input.readOnly = true;
          if (!ok) qCorrect = false;
        });

        if (qCorrect) correctCount++;
        historyAnswers[`q_${q.id}`] = { question: q.question, template: q.guide_template, given: given, correct: q.correct_answer, ok: qCorrect, explain: q.explain || '' };
        qBox.classList.add(qCorrect ? 'correct-q' : 'wrong-q');
        document.getElementById(`explain-${q.id}`).style.display = 'block';
      });

      const finalScore = Math.round(correctCount / examData.questions.length * 100);
      const board = document.getElementById('score-board');
      board.innerText = `您的得分：${finalScore} 分（答對 ${correctCount} / ${examData.questions.length} 題）`;
      board.style.display = 'block';
      document.getElementById('submit-btn').style.display = 'none';

      uploadResultToCloud({
        exam_id: examId,
        student_name: document.getElementById('student-name').value.trim(),
        score: finalScore,
        answers: historyAnswers
      });
    });
  </script>
</body>
</html>
