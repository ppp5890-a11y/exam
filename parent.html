<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上考卷產生器 - 家長管理後台</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; padding: 16px; }
    .container { max-width: 680px; margin: 0 auto 16px; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 22px; border: 1px solid #e5e7eb; }
    h1 { color: #1e3a8a; margin: 0 0 14px; font-size: 21px; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; }
    label { display: block; font-weight: bold; margin: 12px 0 4px; color: #374151; }
    select, input, textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
    .row { display: flex; gap: 10px; } .row > div { flex: 1; }
    .btn { background: #10b981; color: white; font-weight: bold; padding: 12px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 14px; }
    .btn:disabled { opacity: .5; }
    .btn-sm { background: #3b82f6; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; width: auto; }
    .btn-del { background: #ef4444; }
    .link-text { background: #eff6ff; padding: 10px; border: 1px solid #93c5fd; border-radius: 6px; word-break: break-all; font-family: monospace; font-size: 14px; margin: 8px 0; color: #1e40af; }
    .status { margin-top: 10px; font-size: 15px; } .err { color: #dc2626; } .okmsg { color: #16a34a; }
    .qd { padding: 10px; border: 2px solid #e5e7eb; border-radius: 6px; margin-bottom: 10px; line-height: 1.8; }
    .okq { border-color: #22c55e; } .midq { border-color: #f59e0b; } .badq { border-color: #ef4444; } .flagq { border-color: #f59e0b; background: #fffbeb; }
    .ok { background: #dcfce7; padding: 1px 8px; border-radius: 4px; font-weight: bold; }
    .bad { background: #fee2e2; padding: 1px 8px; border-radius: 4px; font-weight: bold; }
    .muted { color: #6b7280; font-size: 14px; }
    .rec { border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
    .rec-head { display: flex; justify-content: space-between; align-items: center; padding: 12px; cursor: pointer; background: #f9fafb; gap: 8px; }
    .score { font-size: 20px; font-weight: bold; } .good { color: #16a34a; } .mid { color: #d97706; } .low { color: #dc2626; }
    .detail { display: none; padding: 12px; }
    .hide { display: none; }
    .sec-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; cursor: pointer; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; margin-bottom: 14px; }
    .sec-head h1 { border: 0; margin: 0; padding: 0; }
    .sec-head.closed { border-bottom: 0; padding-bottom: 0; margin-bottom: 0; }
    .sec-btns { display: flex; gap: 6px; flex-shrink: 0; }
    label.chk { display: block; font-weight: normal; margin: 4px 0; }

    .sec-t { font-weight: bold; color: #1e3a8a; margin: 14px 0 6px; font-size: 16px; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
    .modal.hide { display: none; }
    .modal-box { background: white; border-radius: 12px; padding: 20px; width: 100%; max-width: 360px; }
    .modal-box .btn { margin-top: 10px; }
    #printArea { display: none; }
    .paper { color: #111; font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "Microsoft JhengHei", serif; font-size: 15px; line-height: 2; }
    .paper .p-title { text-align: center; font-size: 24px; font-weight: bold; letter-spacing: 2px; border-bottom: 3px double #111; padding-bottom: 6px; margin-bottom: 10px; }
    .paper .p-head { display: flex; justify-content: space-between; gap: 14px; margin-bottom: 12px; }
    .paper .p-lines { flex: 1; line-height: 2.1; }
    .paper .line { display: inline-block; border-bottom: 1px solid #111; min-width: 7em; }
    .paper .p-scorebox { width: 96px; border: 2px solid #111; text-align: center; min-height: 70px; }
    .paper .p-scorebox div { border-bottom: 1px solid #111; line-height: 1.8; }
    .paper .p-sec { font-weight: bold; font-size: 17px; margin: 16px 0 6px; page-break-after: avoid; }
    .paper .p-sec .sub { font-weight: normal; font-size: 13px; color: #444; margin-left: 6px; }
    .paper .pq { margin: 0 0 10px; page-break-inside: avoid; }
    .paper .pn { font-weight: bold; margin-right: 4px; }
    .paper .pts { font-size: 12px; color: #555; margin-left: 4px; }
    .paper .pa { display: inline-block; min-width: 3.4em; text-align: center; margin-right: 2px; }
    .paper .pb { display: inline-block; border-bottom: 1px solid #111; min-width: 4.5em; margin: 0 3px; }
    .paper .po { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; margin-left: 2.6em; }
    .paper .pl { border-bottom: 1px solid #6b7280; height: 30px; }
    .paper .ans-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 2px 14px; }
    .paper .ans-grid .wide { grid-column: 1 / -1; }
    .paper.view { background: #fff; border: 1px solid #d1d5db; border-radius: 4px; padding: 16px 18px; box-shadow: 0 1px 3px rgba(0,0,0,.12); margin-top: 6px; }
    .paper .ak { color: #dc2626; font-weight: bold; }
    .paper .pb .ak { display: inline-block; min-width: 3em; text-align: center; }
    .paper .pe { color: #6b7280; font-size: 13px; line-height: 1.7; }
    .paper .pans { border-bottom: 1px solid #6b7280; min-height: 30px; line-height: 30px; }
    .paper .pq.flagq { background: #fffbeb; border-left: 4px solid #f59e0b; padding-left: 8px; }
    .paper .pinfo { text-align: center; color: #444; font-size: 14px; margin-bottom: 6px; }
    .paper .p-scorebox .lbl { border-bottom: 1px solid #111; line-height: 1.8; }
    .paper .p-scorebox .val { border-bottom: 0; color: #dc2626; font-weight: bold; font-size: 28px; line-height: 1.6; min-height: 48px; display: flex; align-items: center; justify-content: center; }
    .paper .p-scorebox .val small { font-size: 13px; margin-left: 2px; }
    .paper .p-lines .line { min-width: 8em; }
    .paper .pt { margin-top: 2px; }
    .paper .gq { position: relative; padding-left: 30px; }
    .paper .mk { position: absolute; left: 0; top: -2px; color: #dc2626; font-size: 24px; font-weight: bold; }
    .paper .gp { color: #dc2626; font-size: 13px; margin-left: 4px; }
    .paper .fill { display: inline-block; min-width: 3em; text-align: center; border-bottom: 1px solid #111; padding: 0 4px; margin: 0 3px; }
    .paper .fill.wrong { color: #dc2626; text-decoration: line-through; }
    .paper .fix { color: #dc2626; font-weight: bold; margin-top: 2px; }
    .paper .o { display: inline-block; margin-right: 18px; padding: 0 4px; }
    .paper .o.ch { border: 1.5px solid #111; border-radius: 12px; }
    .paper .o.cr { color: #dc2626; font-weight: bold; }
    .paper .given { border-bottom: 1px solid #6b7280; margin-top: 2px; }
    @media print {
      @page { size: A4; margin: 14mm; }
      body { background: #fff; padding: 0; }
      body.printing #app, body.printing #login, body.printing #printModal { display: none !important; }
      body.printing #printArea { display: block; }
      .paper { page-break-after: always; }
      .paper:last-child { page-break-after: auto; }
    }
  </style>
</head>
<body>

  <div class="container" id="login">
    <h1>🔒 家長登入</h1>
    <label>家長密碼</label>
    <input type="password" id="pc" placeholder="請輸入家長密碼">
    <button class="btn" id="loginBtn">登入</button>
    <div id="loginMsg" class="status err"></div>
  </div>

  <div id="app" class="hide">
    <div class="container">
      <h1>📝 AI 出題</h1>
      <div class="row">
        <div><label>年級</label>
          <select id="grade" onchange="updateSubjects()"><option>國小一年級</option><option>國小二年級</option><option selected>國小三年級</option><option>國小四年級</option><option>國小五年級</option><option>國小六年級</option><option>國中一年級</option><option>國中二年級</option><option>國中三年級</option></select></div>
        <div><label>科目</label>
          <select id="subject"><option>數學</option><option>國語</option><option>自然</option><option>社會</option><option>英語</option></select></div>
        <div><label>版本</label><select id="publisher"><option>不指定</option><option>康軒</option><option>南一</option><option>翰林</option></select></div>
      </div>
      <div class="row"><div style="flex:1"><label>學期</label><select id="term"><option>不指定</option><option>上學期</option><option>下學期</option></select></div><div style="flex:2"><label>範圍／單元（選填）</label><input id="scope" placeholder="例：分數與小數大小比較；留空就由 AI 依年級決定"></div></div>
      <div id="unitBox" class="hide">
        <label>單元（可多選；都不勾＝整個學期）</label>
        <div id="unitList"></div>
        <button class="btn-sm" id="editUnits" style="margin-top:6px">編輯清單</button>
        <div id="unitEdit" class="hide" style="margin-top:8px">
          <div class="muted">每行一個單元，格式：單元名稱｜重點（用全形直線 ｜ 分隔）</div>
          <textarea id="unitText" rows="8"></textarea>
          <button class="btn-sm" id="saveUnits" style="margin-top:6px">儲存清單</button>
          <span id="unitMsg" class="muted"></span>
        </div>
      </div>
      <div class="row">
        <div><label>題數</label><select id="count"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div>
        <div><label>難度</label><select id="level"><option>基礎</option><option selected>中等</option><option>進階</option></select></div>
        <div><label>題型</label><select id="qtype"><option value="mix">混合（依原比例）</option><option value="mc">只有選擇</option><option value="blank">只有填空</option><option value="short">只有簡答</option></select></div>
      </div>
      <button class="btn" id="genBtn">✨ AI 出題</button>
      <div id="genMsg" class="status"></div>
    </div>

    <div class="container hide" id="preview">
      <h1>👀 預覽與發布</h1>
      <label>考卷標題</label>
      <input id="title">
      <div id="verifyNote" class="muted" style="margin:8px 0"></div>
      <div id="qlist"></div>
      <button class="btn" id="pubBtn">📤 發布考卷並產生連結</button>
      <div id="pubMsg" class="status"></div>
      <div id="linkBox" class="hide">
        <div class="link-text" id="examLink"></div>
        <button class="btn-sm" id="copyBtn">📋 複製連結</button>
      </div>
    </div>

    <div class="container">
      <div class="sec-head closed" id="examsHead" onclick="toggleSec(event, 'examsHead', 'examsWrap', 'examsArrow')">
        <h1><span id="examsArrow">▶</span> 📚 已發布的考卷 <span class="muted" id="examsCount"></span></h1>
        <div class="sec-btns"><button class="btn-sm" id="examsRefresh">重新整理</button><button class="btn-sm btn-del" id="examsClear">全部刪除</button></div>
      </div>
      <div id="examsWrap" class="hide">
        <div class="muted" style="margin-bottom:8px">點考卷可以看題目、答案與解析。</div>
        <div id="examsBox">載入中...</div>
      </div>
    </div>

    <div class="container">
      <div class="sec-head closed" id="resHead" onclick="toggleSec(event, 'resHead', 'resWrap', 'resArrow')">
        <h1><span id="resArrow">▶</span> 📊 小孩成績紀錄 <span class="muted" id="resCount"></span></h1>
        <div class="sec-btns"><button class="btn-sm" id="refreshBtn">重新整理</button><button class="btn-sm btn-del" id="clearBtn">全部清除</button></div>
      </div>
      <div id="resWrap" class="hide">
        <div id="results">載入中...</div>
      </div>
    </div>
  </div>

  <div id="printModal" class="modal hide">
    <div class="modal-box">
      <b id="pmTitle"></b>
      <div class="muted" style="margin-top:6px">請選擇要列印的內容。考卷只印題目，不含答案；答案卷只列各大題答案，會另起一頁。</div>
      <button class="btn" id="pm1">只印考卷</button>
      <button class="btn" id="pm3" style="background:#3b82f6">只印答案卷</button>
      <button class="btn" id="pm2" style="background:#8b5cf6">考卷＋答案卷（答案卷另起一頁）</button>
      <button class="btn" id="pm0" style="background:#6b7280">取消</button>
    </div>
  </div>
  <div id="printArea"></div>

  <script>
    const API = 'https://kxrtesreuuaumdikeqrv.supabase.co/functions/v1/api';
    const KEY = 'sb_publishable_1NB_TggvO0cURnJaIT7D6g_791CoJLD';
    const $ = id => document.getElementById(id);
    const clean = s => String(s).replace(/\^\{?(\d+)\}?/g, (m, d) => [...d].map(c => '⁰¹²³⁴⁵⁶⁷⁸⁹'[c]).join('')).replace(/\$([^$]*\\[^$]*)\$/g, '$1').replace(/\\d?frac\{([^{}]*)\}\{([^{}]*)\}/g, '$1/$2').replace(/\\times/g, '×').replace(/\\div/g, '÷').replace(/\\cdot/g, '·').replace(/\\text\{([^{}]*)\}/g, '$1').replace(/\\[()\[\]]/g, '').replace(/[{}]/g, '');
    const esc = s => clean(String(s == null ? '' : s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const L = 'ABCD';
    const C4 = '①②③④', CN = ['一', '二', '三', '四'];
    const SEC = [['blank', '填空題'], ['mc', '選擇題'], ['short', '簡答題']];
    function groupBy(items, typeOf) {
      const out = [];
      SEC.forEach(([t, label]) => { const idx = []; items.forEach((x, i) => { if (typeOf(x) === t) idx.push(i); }); if (idx.length) out.push({ type: t, label, idx }); });
      out.forEach((g, k) => { g.no = CN[k]; });
      return out;
    }
    const qt = s => esc(s).replace(/\[blank\]/g, '＿＿');
    let passcode = localStorage.getItem('pc') || '', draft = null;

    async function call(body) {
      const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': KEY }, body: JSON.stringify({ ...body, passcode }) });
      let d; try { d = await r.json(); } catch (e) { throw new Error('HTTP ' + r.status); }
      if (!r.ok) throw new Error(d.error || d.message || ('HTTP ' + r.status));
      return d;
    }

    // ---------- 科目依年級切換 ----------
    const SUBJECTS = {
      low: ['國語', '數學', '生活', '英語'],
      mid: ['國語', '數學', '自然', '社會', '英語'],
      jr: ['國文', '數學', '英語', '歷史', '地理', '公民', '理化', '生物', '地球科學']
    };
    function updateSubjects() {
      const g = $('grade').value;
      const set = g.startsWith('國中') ? SUBJECTS.jr : (/一年級|二年級/.test(g) ? SUBJECTS.low : SUBJECTS.mid);
      const cur = $('subject').value;
      $('subject').innerHTML = set.map(x => `<option>${x}</option>`).join('');
      if (set.includes(cur)) $('subject').value = cur;
    }
    updateSubjects();
    try { $('publisher').value = localStorage.getItem('pub') || '不指定'; } catch (e) {}
    $('publisher').onchange = () => { try { localStorage.setItem('pub', $('publisher').value); } catch (e) {} };

    // ---------- 登入 ----------
    async function login(pc) {
      passcode = pc;
      try { await call({ action: 'check' }); localStorage.setItem('pc', pc); $('login').classList.add('hide'); $('app').classList.remove('hide'); loadResults(); loadExams(); loadUnits(); }
      catch (e) { localStorage.removeItem('pc'); $('login').classList.remove('hide'); $('app').classList.add('hide'); $('loginMsg').innerText = e.message; }
    }
    $('loginBtn').onclick = () => login($('pc').value);
    $('pc').onkeydown = e => { if (e.key === 'Enter') login($('pc').value); };
    if (passcode) login(passcode);

    // ---------- 單元清單 ----------
    let units = [];
    const unitKey = () => ({ publisher: $('publisher').value, grade: $('grade').value, subject: $('subject').value, term: $('term').value });
    async function loadUnits() {
      units = [];
      const k = unitKey();
      if (k.publisher === '不指定' || k.term === '不指定') { $('unitBox').classList.add('hide'); return; }
      try { units = (await call({ action: 'units', ...k })).units || []; } catch (e) { units = []; }
      $('unitEdit').classList.add('hide');
      $('unitList').innerHTML = units.length
        ? units.map((u, i) => `<label class="chk"><input type="checkbox" data-i="${i}"> <b>${esc(u.t)}</b> <span class="muted">${esc(u.d)}</span></label>`).join('')
        : '<div class="muted">這個組合還沒有單元清單，AI 會依年級與學期自行決定範圍。可按「編輯清單」自己建立。</div>';
      $('unitBox').classList.remove('hide');
    }
    function pickUnits() {
      const sel = [...document.querySelectorAll('#unitList input:checked')].map(x => units[+x.dataset.i]);
      return sel.length ? sel : units;
    }
    ['grade', 'subject', 'publisher', 'term'].forEach(id => $(id).addEventListener('change', loadUnits));
    $('editUnits').onclick = () => { $('unitText').value = units.map(u => u.t + '｜' + u.d).join('\n'); $('unitEdit').classList.remove('hide'); };
    $('saveUnits').onclick = async () => {
      const list = $('unitText').value.split('\n').map(s => s.trim()).filter(Boolean).map(s => { const [t, ...d] = s.split('｜'); return { t: t.trim(), d: d.join('｜').trim() }; });
      try { await call({ action: 'units_save', ...unitKey(), units: list }); $('unitMsg').innerText = '已儲存'; await loadUnits(); }
      catch (e) { $('unitMsg').innerText = '儲存失敗：' + e.message; }
    };

    // ---------- 出題 ----------
    $('genBtn').onclick = async () => {
      const btn = $('genBtn'), msg = $('genMsg');
      btn.disabled = true; msg.className = 'status'; msg.innerText = '出題中，約需 20～60 秒，請不要關閉頁面…';
      try {
        draft = await call({ action: 'generate', grade: $('grade').value, subject: $('subject').value, scope: $('scope').value.trim(), count: $('count').value, level: $('level').value, qtype: $('qtype').value, publisher: $('publisher').value, term: $('term').value, units: pickUnits() });
        msg.innerText = ''; renderDraft();
      } catch (e) { msg.className = 'status err'; msg.innerText = '出題失敗：' + e.message; }
      btn.disabled = false;
    };

    function renderDraft() {
      $('preview').classList.remove('hide'); $('linkBox').classList.add('hide'); $('pubMsg').innerText = '';
      $('title').value = draft.title;
      const flags = draft.questions.filter(q => q.flag).length;
      $('verifyNote').innerText = !draft.questions.some(q => q.type !== 'short') ? '（全部是簡答題，沒有經過 AI 二次驗算，請自行確認參考答案）' : !draft.verified ? '（這次沒有完成 AI 二次驗算，請自行確認答案）' : flags ? `⚠ 有 ${flags} 題 AI 兩次解答不一致，已用橘色標出，建議刪除或再確認。` : '✅ AI 已獨立重算一次，填空與選擇題答案一致。簡答題需要家長自行留意。';
      $('qlist').innerHTML = keyPaper({ title: draft.title, grade: $('grade').value, subject: $('subject').value, items: draft.questions },
        i => `<div><button class="btn-sm btn-del" onclick="delQ(${i})">刪除這題</button>${draft.questions[i].flag ? ' <b style="color:#d97706">⚠ 答案存疑</b>' : ''}</div>`);
    }
    function delQ(i) { draft.questions.splice(i, 1); renderDraft(); }

    $('pubBtn').onclick = async () => {
      if (!draft.questions.length) { $('pubMsg').className = 'status err'; $('pubMsg').innerText = '沒有題目可以發布'; return; }
      const btn = $('pubBtn'), msg = $('pubMsg'); btn.disabled = true; msg.className = 'status'; msg.innerText = '發布中…';
      try {
        draft.title = $('title').value.trim() || draft.title;
        const r = await call({ action: 'publish', draft, grade: $('grade').value, subject: $('subject').value, scope: $('scope').value.trim() });
        $('examLink').innerText = new URL('index.html?exam_id=' + r.id, location.href).href;
        $('linkBox').classList.remove('hide'); msg.className = 'status okmsg'; msg.innerText = '🎉 已發布！請複製連結傳給小朋友。'; loadExams();
      } catch (e) { msg.className = 'status err'; msg.innerText = '發布失敗：' + e.message; }
      btn.disabled = false;
    };
    $('copyBtn').onclick = () => navigator.clipboard.writeText($('examLink').innerText).then(() => { $('copyBtn').innerText = '已複製'; });

    // ---------- 成績 ----------
    function card(r, i) {
      const cls = r.ok ? 'okq' : (r.got > 0 ? 'midq' : 'badq'), icon = r.ok ? '✅' : (r.got > 0 ? '🟡' : '❌');
      let body = '';
      if (r.type === 'blank') {
        body = '<div>' + String(r.template).split('[blank]').map((p, j) => esc(p) + (j < r.correct.length
          ? `<span class="${String(r.given[j] || '').trim() === String(r.correct[j]).trim() ? 'ok' : 'bad'}">${esc(r.given[j] || '（空白）')}</span>` : '')).join('') + '</div>';
        if (!r.ok) body += `<div>正確答案：<b>${esc(r.correct.join('、'))}</b></div>`;
      } else if (r.type === 'mc') {
        body = r.options.map((o, j) => `<div>${C4[j]} ${esc(o)} ${j === r.given ? '👈 作答' : ''} ${j === r.correct ? '✔ 正確' : ''}</div>`).join('');
      } else body = `<div>作答：${esc(r.given || '（空白）')}</div><div>參考答案：<b>${esc(r.correct)}</b></div>`;
      return `<div class="qd ${cls}"><div><b>${i + 1}. ${icon}</b> ${qt(r.question)} <span class="muted">(${r.got}/${r.max})</span></div>${body}` +
        (r.comment ? `<div class="muted">講評：${esc(r.comment)}</div>` : '') + (r.explain ? `<div class="muted">解析：${esc(r.explain)}</div>` : '') + '</div>';
    }
    // 相容舊格式資料
    function legacy(a) {
      if (!a || typeof a !== 'object') return [];
      return Object.keys(a).sort((x, y) => parseInt(x.slice(2)) - parseInt(y.slice(2))).map(k => {
        const q = a[k];
        if (Array.isArray(q)) return { type: 'short', question: '（舊格式資料）', given: q.join('、'), correct: '—', ok: false, got: 0, max: 0, explain: '' };
        return { type: 'blank', question: q.question, template: q.template, given: q.given, correct: q.correct, ok: q.ok, got: q.ok ? 1 : 0, max: 1, explain: q.explain };
      });
    }
    function gradedQ(r, n) {
      const mk = r.ok ? '✓' : (r.got > 0 ? '△' : '✗');
      const pts = `<span class="gp">${r.got}/${r.max}</span>`;
      let pre = '', body = '';
      if (r.type === 'blank') {
        const given = Array.isArray(r.given) ? r.given : [];
        body = '<div class="pt">' + String(r.template).split('[blank]').map((p, j) => esc(p) + (j < r.correct.length
          ? `<span class="fill ${String(given[j] || '').trim() === String(r.correct[j]).trim() ? '' : 'wrong'}">${esc(given[j] || '　')}</span>` : '')).join('') + '</div>';
        if (!r.ok) body += `<div class="fix">正確答案：${esc(r.correct.join('、'))}</div>`;
      } else if (r.type === 'mc') {
        pre = `<span class="pa">（${r.given != null && r.given !== '' ? C4[r.given] : '　'}）</span>`;
        body = '<div>' + r.options.map((o, j) => `<span class="o ${j === r.given ? 'ch' : ''} ${j === r.correct ? 'cr' : ''}">${C4[j]} ${esc(o)}${j === r.correct ? ' ✔' : ''}</span>`).join('') + '</div>';
        if (!r.ok) body += `<div class="fix">正確答案：${C4[r.correct]}</div>`;
      } else {
        body = `<div class="given">${esc(r.given || '（空白）')}</div><div class="fix">參考答案：${esc(r.correct)}</div>`;
      }
      return `<div class="pq gq"><span class="mk">${mk}</span>${pre}<span class="pn">${n}.</span>${qt(r.question)}${pts}${body}` +
        (r.comment ? `<div class="pe">講評：${esc(r.comment)}</div>` : '') + (r.explain ? `<div class="pe">解析：${esc(r.explain)}</div>` : '') + '</div>';
    }
    function resultPaper(r, title, items) {
      const total = items.reduce((s, x) => s + (x.max || 0), 0) || 100;
      const secs = groupBy(items, x => x.type).map(g => {
        const got = g.idx.reduce((s, i) => s + (items[i].got || 0), 0), max = g.idx.reduce((s, i) => s + (items[i].max || 0), 0);
        let inner;
        try { inner = g.idx.map((i, n) => gradedQ(items[i], n + 1)).join(''); }
        catch (e) { inner = g.idx.map((i, n) => card(items[i], n)).join(''); }
        return `<div class="p-sec">${g.no}、${g.label}<span class="sub">（得 ${got} / ${max} 分）</span></div>` + inner;
      }).join('');
      return `<div class="paper view"><div class="p-title">${esc(title)}</div>` +
        `<div class="p-head"><div class="p-lines"><div>姓名：<span class="line">${esc(r.student_name || '（未填姓名）')}</span></div><div>日期：<span class="line">${esc(new Date(r.created_at).toLocaleDateString('zh-TW'))}</span></div></div>` +
        `<div class="p-scorebox"><div class="lbl">得分</div><div class="val">${esc(r.score)}<small>/${total}</small></div></div></div>` + (secs || '<div class="muted">沒有作答內容。</div>') + '</div>';
    }
    function cardsHTML(items) {
      return groupBy(items, r => r.type).map(g => `<div class="sec-t">${g.no}、${g.label}</div>` + g.idx.map((i, n) => card(items[i], n)).join('')).join('');
    }
    let resultRows = [];
    async function loadResults() {
      const box = $('results'); box.textContent = '載入中...';
      try {
        const { rows, names } = await call({ action: 'results' });
        resultRows = rows;
        $('resCount').innerText = '（' + rows.length + ' 筆）';
        if (!rows.length) { box.innerHTML = '<div class="muted">目前還沒有人繳交考卷。</div>'; return; }
        box.innerHTML = rows.map((r, i) => {
          const cls = r.score >= 80 ? 'good' : r.score >= 60 ? 'mid' : 'low';
          const items = Array.isArray(r.answers) ? r.answers : legacy(r.answers);
          return `<div class="rec"><div class="rec-head" onclick="var d=document.getElementById('d${i}');d.style.display=d.style.display==='block'?'none':'block'">
            <div><b>${esc(r.student_name || '（未填姓名）')}</b><br><span class="muted">${esc(names[r.exam_id] || r.exam_id)} · ${esc(new Date(r.created_at).toLocaleString('zh-TW'))}</span></div>
            <div style="display:flex;align-items:center;gap:8px"><div class="score ${cls}">${esc(r.score)} 分</div><button class="btn-sm btn-del" onclick="event.stopPropagation();delResult(${i})">刪除</button></div></div>
            <div class="detail" id="d${i}">${resultPaper(r, names[r.exam_id] || r.exam_id, items)}</div></div>`;
        }).join('');
      } catch (e) { box.innerHTML = '<div class="err">讀取失敗：' + esc(e.message) + '</div>'; }
    }
    $('refreshBtn').onclick = loadResults;

    // ---------- 刪除成績 ----------
    async function delResult(i) {
      const r = resultRows[i];
      if (!r) return;
      if (!confirm('確定要刪除「' + (r.student_name || '（未填姓名）') + '」這筆成績（' + r.score + ' 分）嗎？刪除後無法復原。')) return;
      try { await call({ action: 'result_delete', id: r.id }); await loadResults(); }
      catch (e) { alert('刪除失敗：' + e.message); }
    }
    $('clearBtn').onclick = async () => {
      if (!resultRows.length) { alert('目前沒有成績可以清除。'); return; }
      if (!confirm('確定要清除全部 ' + resultRows.length + ' 筆成績嗎？刪除後無法復原。')) return;
      if (!confirm('再確認一次：真的要全部清除嗎？（已發布的考卷不會被刪除）')) return;
      try { await call({ action: 'results_clear' }); await loadResults(); }
      catch (e) { alert('清除失敗：' + e.message); }
    };

    // ---------- 已發布的考卷 ----------
    let examRows = [];
    const secSum = (x, g) => g.idx.reduce((s, i) => s + (x.items[i].points || 0), 0);
    // 紙本版面＋答案（紅字）。預覽與已發布考卷共用
    function keyQ(q, n, extra) {
      const pts = q.points ? `<span class="pts">（${q.points} 分）</span>` : '';
      let pre = '', body = '';
      if (q.type === 'blank') {
        let b = 0; const ans = q.answer || [];
        body = `<div>${esc(q.template).replace(/\[blank\]/g, () => `<span class="pb"><span class="ak">${esc(ans[b++] || '')}</span></span>`)}</div>`;
      } else if (q.type === 'mc') {
        pre = `<span class="pa">（<span class="ak">${C4[q.answer] || '　'}</span>）</span>`;
        body = `<div class="po">${(q.options || []).map((o, j) => `<span class="${j === q.answer ? 'ak' : ''}">${C4[j]} ${esc(o)}</span>`).join('')}</div>`;
      } else body = `<div class="pans ak">${esc(q.answer)}</div>`;
      return `<div class="pq ${q.flag ? 'flagq' : ''}">${pre}<span class="pn">${n}.</span>${qt(q.q)}${pts}${body}${q.explain ? `<div class="pe">解析：${esc(q.explain)}</div>` : ''}${extra || ''}</div>`;
    }
    function keyPaper(x, extraFn) {
      const hasPts = x.items.some(q => q.points);
      return `<div class="paper view"><div class="p-title">${esc(x.title)}</div><div class="pinfo">${esc(x.grade || '')}　${esc(x.subject || '')}${x.scope ? '　範圍：' + esc(x.scope) : ''}</div>` +
        groupBy(x.items, q => q.type).map(g => `<div class="p-sec">${g.no}、${g.label}<span class="sub">（${hasPts ? '共 ' + secSum(x, g) + ' 分' : '共 ' + g.idx.length + ' 題'}）</span></div>` +
          g.idx.map((i, n) => keyQ(x.items[i], n + 1, extraFn ? extraFn(i) : '')).join('')).join('') + '</div>';
    }
    const fullHTML = x => keyPaper(x);
    const fullCache = {};
    async function getFull(id) { if (!fullCache[id]) fullCache[id] = await call({ action: 'exam_full', exam_id: id }); return fullCache[id]; }

    // ---------- 列印：考卷（只印題目）與答案卷（只印各大題答案）----------
    function pq(q, n) {
      const pts = q.points ? `<span class="pts">（${q.points} 分）</span>` : '';
      if (q.type === 'blank') return `<div class="pq"><span class="pn">${n}.</span>${qt(q.q)}${pts}<div>${esc(q.template).replace(/\[blank\]/g, '<span class="pb"></span>')}</div></div>`;
      if (q.type === 'mc') return `<div class="pq"><span class="pa">（　　）</span><span class="pn">${n}.</span>${qt(q.q)}${pts}<div class="po">${(q.options || []).map((o, j) => `<span>${C4[j]} ${esc(o)}</span>`).join('')}</div></div>`;
      return `<div class="pq"><span class="pn">${n}.</span>${qt(q.q)}${pts}<div class="pl"></div><div class="pl"></div><div class="pl"></div></div>`;
    }
    function examPaper(x) {
      return `<section class="paper"><div class="p-title">${esc(x.title)}</div>` +
        `<div class="p-head"><div class="p-lines"><div>${esc(x.grade)}　${esc(x.subject)}</div><div>姓名：<span class="line"></span></div><div>日期：<span class="line"></span></div></div><div class="p-scorebox"><div>得分</div></div></div>` +
        groupBy(x.items, q => q.type).map(g => `<div class="p-sec">${g.no}、${g.label}<span class="sub">（共 ${secSum(x, g)} 分）</span></div>` + g.idx.map((i, n) => pq(x.items[i], n + 1)).join('')).join('') + '</section>';
    }
    function ansText(q) { return q.type === 'blank' ? esc((q.answer || []).join('、')) : q.type === 'mc' ? (C4[q.answer] || '') : esc(q.answer); }
    function answerSheet(x) {
      return `<section class="paper"><div class="p-title">${esc(x.title)}　答案卷</div><div class="p-lines" style="margin-bottom:8px">${esc(x.grade)}　${esc(x.subject)}</div>` +
        groupBy(x.items, q => q.type).map(g => `<div class="p-sec">${g.no}、${g.label}</div><div class="ans-grid">` +
          g.idx.map((i, n) => `<div class="${x.items[i].type === 'short' ? 'wide' : ''}"><b>${n + 1}.</b> ${ansText(x.items[i])}</div>`).join('') + '</div>').join('') + '</section>';
    }
    let pmIdx = null;
    function askPrint(i) { pmIdx = i; $('pmTitle').innerText = examRows[i].title; $('printModal').classList.remove('hide'); }
    async function doPrint(mode) {
      $('printModal').classList.add('hide');
      const e = examRows[pmIdx]; if (!e) return;
      try {
        const x = await getFull(e.id);
        $('printArea').innerHTML = (mode !== 'ans' ? examPaper(x) : '') + (mode !== 'paper' ? answerSheet(x) : '');
        document.body.classList.add('printing');
        setTimeout(() => window.print(), 150);
      } catch (err) { alert('讀取考卷失敗：' + err.message); }
    }
    window.addEventListener('afterprint', () => { document.body.classList.remove('printing'); $('printArea').innerHTML = ''; });
    $('pm1').onclick = () => doPrint('paper'); $('pm2').onclick = () => doPrint('both'); $('pm3').onclick = () => doPrint('ans');
    $('pm0').onclick = () => $('printModal').classList.add('hide');
    async function loadExams() {
      const box = $('examsBox'); box.textContent = '載入中...';
      try {
        const { exams } = await call({ action: 'exams_list' });
        examRows = exams;
        $('examsCount').innerText = '（' + exams.length + ' 份）';
        if (!exams.length) { box.innerHTML = '<div class="muted">還沒有發布過考卷。</div>'; return; }
        box.innerHTML = exams.map((e, i) => `<div class="rec"><div class="rec-head" onclick="openExam(${i})">
          <div><b>${esc(e.title)}</b><br><span class="muted">${esc(e.grade)} ${esc(e.subject)}${e.count ? ' · ' + e.count + ' 題' : ''}${e.created_at ? ' · ' + esc(new Date(e.created_at).toLocaleString('zh-TW')) : ''}</span></div>
          <div style="display:flex;gap:6px;flex-shrink:0"><button class="btn-sm" onclick="event.stopPropagation();copyExam(${i}, this)">複製連結</button><button class="btn-sm" style="background:#8b5cf6" onclick="event.stopPropagation();askPrint(${i})">列印</button><button class="btn-sm btn-del" onclick="event.stopPropagation();delExam(${i})">刪除</button></div></div>
          <div class="detail" id="e${i}"></div></div>`).join('');
      } catch (e) { box.innerHTML = '<div class="err">讀取失敗：' + esc(e.message) + '</div>'; }
    }
    function examLinkOf(i) { return new URL('index.html?exam_id=' + examRows[i].id, location.href).href; }
    function copyExam(i, btn) { navigator.clipboard.writeText(examLinkOf(i)).then(() => { btn.innerText = '已複製'; }); }
    async function openExam(i) {
      const d = $('e' + i);
      if (d.style.display === 'block') { d.style.display = 'none'; return; }
      d.style.display = 'block';
      if (d.dataset.loaded) return;
      d.innerHTML = '<div class="muted">載入中...</div>';
      try {
        const x = await getFull(examRows[i].id);
        d.innerHTML = fullHTML(x);
        d.dataset.loaded = '1';
      } catch (e) { d.innerHTML = '<div class="err">讀取失敗：' + esc(e.message) + '</div>'; }
    }
    $('examsRefresh').onclick = loadExams;

    function toggleSec(ev, headId, wrapId, arrowId) {
      if (ev.target.closest('button')) return;
      const w = $(wrapId), open = w.classList.contains('hide');
      w.classList.toggle('hide', !open);
      $(headId).classList.toggle('closed', !open);
      $(arrowId).innerText = open ? '▼' : '▶';
    }
    async function delExam(i) {
      const e = examRows[i];
      if (!e) return;
      if (!confirm('確定要刪除考卷「' + e.title + '」嗎？\n這份考卷的題目、答案和所有小孩的成績都會一起刪除，小孩手上的連結也會失效，無法復原。')) return;
      try { await call({ action: 'exam_delete', exam_id: e.id }); await loadExams(); await loadResults(); }
      catch (err) { alert('刪除失敗：' + err.message); }
    }
    $('examsClear').onclick = async () => {
      if (!examRows.length) { alert('目前沒有考卷可以刪除。'); return; }
      if (!confirm('確定要刪除全部 ' + examRows.length + ' 份考卷嗎？\n所有題目、答案和成績都會一起刪除，小孩手上的連結也會失效，無法復原。')) return;
      if (!confirm('再確認一次：真的要全部刪除嗎？')) return;
      try { await call({ action: 'exams_clear' }); await loadExams(); await loadResults(); }
      catch (err) { alert('刪除失敗：' + err.message); }
    };
  </script>
</body>
</html>
