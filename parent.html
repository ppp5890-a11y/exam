<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上考卷產生器 - 家長管理後台</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; padding: 16px; }
    .container { max-width: 680px; margin: 0 auto 16px; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 22px; border: 1px solid #e5e7eb; }
    h1 { color: #1e3a8a; margin: 0 0 14px; font-size: 21px; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; }
    label { display: block; font-weight: bold; margin: 12px 0 4px; color: #374151; }
    select, input, textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
    .row { display: flex; gap: 10px; } .row > div { flex: 1; }
    .btn { background: #10b981; color: white; font-weight: bold; padding: 12px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 14px; }
    .btn:disabled { opacity: .5; }
    .btn-sm { background: #3b82f6; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; width: auto; }
    .btn-del { background: #ef4444; }
    .link-text { background: #eff6ff; padding: 10px; border: 1px solid #93c5fd; border-radius: 6px; word-break: break-all; font-family: monospace; font-size: 14px; margin: 8px 0; color: #1e40af; }
    .status { margin-top: 10px; font-size: 15px; } .err { color: #dc2626; } .okmsg { color: #16a34a; }
    .qd { padding: 10px; border: 2px solid #e5e7eb; border-radius: 6px; margin-bottom: 10px; line-height: 1.8; }
    .okq { border-color: #22c55e; } .midq { border-color: #f59e0b; } .badq { border-color: #ef4444; } .flagq { border-color: #f59e0b; background: #fffbeb; }
    .ok { background: #dcfce7; padding: 1px 8px; border-radius: 4px; font-weight: bold; }
    .bad { background: #fee2e2; padding: 1px 8px; border-radius: 4px; font-weight: bold; }
    .muted { color: #6b7280; font-size: 14px; }
    .rec { border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
    .rec-head { display: flex; justify-content: space-between; align-items: center; padding: 12px; cursor: pointer; background: #f9fafb; gap: 8px; }
    .score { font-size: 20px; font-weight: bold; } .good { color: #16a34a; } .mid { color: #d97706; } .low { color: #dc2626; }
    .detail { display: none; padding: 12px; }
    .hide { display: none; }
    label.chk { display: block; font-weight: normal; margin: 4px 0; }
  </style>
</head>
<body>

  <div class="container" id="login">
    <h1>🔒 家長登入</h1>
    <label>家長密碼</label>
    <input type="password" id="pc" placeholder="請輸入家長密碼">
    <button class="btn" id="loginBtn">登入</button>
    <div id="loginMsg" class="status err"></div>
  </div>

  <div id="app" class="hide">
    <div class="container">
      <h1>📝 AI 出題</h1>
      <div class="row">
        <div><label>年級</label>
          <select id="grade" onchange="updateSubjects()"><option>國小一年級</option><option>國小二年級</option><option selected>國小三年級</option><option>國小四年級</option><option>國小五年級</option><option>國小六年級</option><option>國中一年級</option><option>國中二年級</option><option>國中三年級</option></select></div>
        <div><label>科目</label>
          <select id="subject"><option>數學</option><option>國語</option><option>自然</option><option>社會</option><option>英語</option></select></div>
        <div><label>版本</label><select id="publisher"><option>不指定</option><option>康軒</option><option>南一</option><option>翰林</option></select></div>
      </div>
      <div class="row"><div style="flex:1"><label>學期</label><select id="term"><option>不指定</option><option>上學期</option><option>下學期</option></select></div><div style="flex:2"><label>範圍／單元（選填）</label><input id="scope" placeholder="例：分數與小數大小比較；留空就由 AI 依年級決定"></div></div>
      <div id="unitBox" class="hide">
        <label>單元（可多選；都不勾＝整個學期）</label>
        <div id="unitList"></div>
        <button class="btn-sm" id="editUnits" style="margin-top:6px">編輯清單</button>
        <div id="unitEdit" class="hide" style="margin-top:8px">
          <div class="muted">每行一個單元，格式：單元名稱｜重點（用全形直線 ｜ 分隔）</div>
          <textarea id="unitText" rows="8"></textarea>
          <button class="btn-sm" id="saveUnits" style="margin-top:6px">儲存清單</button>
          <span id="unitMsg" class="muted"></span>
        </div>
      </div>
      <div class="row">
        <div><label>題數</label><select id="count"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div>
        <div><label>難度</label><select id="level"><option>基礎</option><option selected>中等</option><option>進階</option></select></div>
        <div><label>題型</label><select id="qtype"><option value="mix">混合（依原比例）</option><option value="mc">只有選擇</option><option value="blank">只有填空</option><option value="short">只有簡答</option></select></div>
      </div>
      <button class="btn" id="genBtn">✨ AI 出題</button>
      <div id="genMsg" class="status"></div>
    </div>

    <div class="container hide" id="preview">
      <h1>👀 預覽與發布</h1>
      <label>考卷標題</label>
      <input id="title">
      <div id="verifyNote" class="muted" style="margin:8px 0"></div>
      <div id="qlist"></div>
      <button class="btn" id="pubBtn">📤 發布考卷並產生連結</button>
      <div id="pubMsg" class="status"></div>
      <div id="linkBox" class="hide">
        <div class="link-text" id="examLink"></div>
        <button class="btn-sm" id="copyBtn">📋 複製連結</button>
      </div>
    </div>

    <div class="container">
      <h1>📚 已發布的考卷 <button class="btn-sm" style="float:right" id="examsRefresh">重新整理</button></h1>
      <div class="muted" style="margin-bottom:8px">點考卷可以看題目、答案與解析。</div>
      <div id="examsBox">載入中...</div>
    </div>

    <div class="container">
      <h1>📊 小孩成績紀錄 <button class="btn-sm" style="float:right" id="refreshBtn">重新整理</button> <button class="btn-sm btn-del" style="float:right;margin-right:6px" id="clearBtn">全部清除</button></h1>
      <div id="results">載入中...</div>
    </div>
  </div>

  <script>
    const API = 'https://kxrtesreuuaumdikeqrv.supabase.co/functions/v1/api';
    const KEY = 'sb_publishable_1NB_TggvO0cURnJaIT7D6g_791CoJLD';
    const $ = id => document.getElementById(id);
    const clean = s => String(s).replace(/\^\{?(\d+)\}?/g, (m, d) => [...d].map(c => '⁰¹²³⁴⁵⁶⁷⁸⁹'[c]).join('')).replace(/\$([^$]*\\[^$]*)\$/g, '$1').replace(/\\d?frac\{([^{}]*)\}\{([^{}]*)\}/g, '$1/$2').replace(/\\times/g, '×').replace(/\\div/g, '÷').replace(/\\cdot/g, '·').replace(/\\text\{([^{}]*)\}/g, '$1').replace(/\\[()\[\]]/g, '').replace(/[{}]/g, '');
    const esc = s => clean(String(s == null ? '' : s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const L = 'ABCD';
    const qt = s => esc(s).replace(/\[blank\]/g, '＿＿');
    let passcode = localStorage.getItem('pc') || '', draft = null;

    async function call(body) {
      const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': KEY }, body: JSON.stringify({ ...body, passcode }) });
      let d; try { d = await r.json(); } catch (e) { throw new Error('HTTP ' + r.status); }
      if (!r.ok) throw new Error(d.error || d.message || ('HTTP ' + r.status));
      return d;
    }

    // ---------- 科目依年級切換 ----------
    const SUBJECTS = {
      low: ['國語', '數學', '生活', '英語'],
      mid: ['國語', '數學', '自然', '社會', '英語'],
      jr: ['國文', '數學', '英語', '歷史', '地理', '公民', '理化', '生物', '地球科學']
    };
    function updateSubjects() {
      const g = $('grade').value;
      const set = g.startsWith('國中') ? SUBJECTS.jr : (/一年級|二年級/.test(g) ? SUBJECTS.low : SUBJECTS.mid);
      const cur = $('subject').value;
      $('subject').innerHTML = set.map(x => `<option>${x}</option>`).join('');
      if (set.includes(cur)) $('subject').value = cur;
    }
    updateSubjects();
    try { $('publisher').value = localStorage.getItem('pub') || '不指定'; } catch (e) {}
    $('publisher').onchange = () => { try { localStorage.setItem('pub', $('publisher').value); } catch (e) {} };

    // ---------- 登入 ----------
    async function login(pc) {
      passcode = pc;
      try { await call({ action: 'check' }); localStorage.setItem('pc', pc); $('login').classList.add('hide'); $('app').classList.remove('hide'); loadResults(); loadExams(); loadUnits(); }
      catch (e) { localStorage.removeItem('pc'); $('login').classList.remove('hide'); $('app').classList.add('hide'); $('loginMsg').innerText = e.message; }
    }
    $('loginBtn').onclick = () => login($('pc').value);
    $('pc').onkeydown = e => { if (e.key === 'Enter') login($('pc').value); };
    if (passcode) login(passcode);

    // ---------- 單元清單 ----------
    let units = [];
    const unitKey = () => ({ publisher: $('publisher').value, grade: $('grade').value, subject: $('subject').value, term: $('term').value });
    async function loadUnits() {
      units = [];
      const k = unitKey();
      if (k.publisher === '不指定' || k.term === '不指定') { $('unitBox').classList.add('hide'); return; }
      try { units = (await call({ action: 'units', ...k })).units || []; } catch (e) { units = []; }
      $('unitEdit').classList.add('hide');
      $('unitList').innerHTML = units.length
        ? units.map((u, i) => `<label class="chk"><input type="checkbox" data-i="${i}"> <b>${esc(u.t)}</b> <span class="muted">${esc(u.d)}</span></label>`).join('')
        : '<div class="muted">這個組合還沒有單元清單，AI 會依年級與學期自行決定範圍。可按「編輯清單」自己建立。</div>';
      $('unitBox').classList.remove('hide');
    }
    function pickUnits() {
      const sel = [...document.querySelectorAll('#unitList input:checked')].map(x => units[+x.dataset.i]);
      return sel.length ? sel : units;
    }
    ['grade', 'subject', 'publisher', 'term'].forEach(id => $(id).addEventListener('change', loadUnits));
    $('editUnits').onclick = () => { $('unitText').value = units.map(u => u.t + '｜' + u.d).join('\n'); $('unitEdit').classList.remove('hide'); };
    $('saveUnits').onclick = async () => {
      const list = $('unitText').value.split('\n').map(s => s.trim()).filter(Boolean).map(s => { const [t, ...d] = s.split('｜'); return { t: t.trim(), d: d.join('｜').trim() }; });
      try { await call({ action: 'units_save', ...unitKey(), units: list }); $('unitMsg').innerText = '已儲存'; await loadUnits(); }
      catch (e) { $('unitMsg').innerText = '儲存失敗：' + e.message; }
    };

    // ---------- 出題 ----------
    $('genBtn').onclick = async () => {
      const btn = $('genBtn'), msg = $('genMsg');
      btn.disabled = true; msg.className = 'status'; msg.innerText = '出題中，約需 20～60 秒，請不要關閉頁面…';
      try {
        draft = await call({ action: 'generate', grade: $('grade').value, subject: $('subject').value, scope: $('scope').value.trim(), count: $('count').value, level: $('level').value, qtype: $('qtype').value, publisher: $('publisher').value, term: $('term').value, units: pickUnits() });
        msg.innerText = ''; renderDraft();
      } catch (e) { msg.className = 'status err'; msg.innerText = '出題失敗：' + e.message; }
      btn.disabled = false;
    };

    function renderDraft() {
      $('preview').classList.remove('hide'); $('linkBox').classList.add('hide'); $('pubMsg').innerText = '';
      $('title').value = draft.title;
      const flags = draft.questions.filter(q => q.flag).length;
      $('verifyNote').innerText = !draft.questions.some(q => q.type !== 'short') ? '（全部是簡答題，沒有經過 AI 二次驗算，請自行確認參考答案）' : !draft.verified ? '（這次沒有完成 AI 二次驗算，請自行確認答案）' : flags ? `⚠ 有 ${flags} 題 AI 兩次解答不一致，已用橘色標出，建議刪除或再確認。` : '✅ AI 已獨立重算一次，填空與選擇題答案一致。簡答題需要家長自行留意。';
      $('qlist').innerHTML = draft.questions.map((q, i) => {
        let body = '';
        if (q.type === 'blank') body = `<div>${esc(q.template)}</div><div>答案：<b>${esc(q.answer.join('、'))}</b></div>`;
        else if (q.type === 'mc') body = q.options.map((o, j) => `<div>${L[j]}. ${esc(o)} ${j === q.answer ? '✔' : ''}</div>`).join('');
        else body = `<div>參考答案：<b>${esc(q.answer)}</b></div>`;
        return `<div class="qd ${q.flag ? 'flagq' : ''}"><div><b>${i + 1}. ${qt(q.q)}</b> <span class="muted">[${{ blank: '填空', mc: '選擇', short: '簡答' }[q.type]}]</span> ${q.flag ? '<b style="color:#d97706">⚠ 答案存疑</b>' : ''}</div>${body}${q.explain ? `<div class="muted">解析：${esc(q.explain)}</div>` : ''}<button class="btn-sm btn-del" onclick="delQ(${i})">刪除這題</button></div>`;
      }).join('');
    }
    function delQ(i) { draft.questions.splice(i, 1); renderDraft(); }

    $('pubBtn').onclick = async () => {
      if (!draft.questions.length) { $('pubMsg').className = 'status err'; $('pubMsg').innerText = '沒有題目可以發布'; return; }
      const btn = $('pubBtn'), msg = $('pubMsg'); btn.disabled = true; msg.className = 'status'; msg.innerText = '發布中…';
      try {
        draft.title = $('title').value.trim() || draft.title;
        const r = await call({ action: 'publish', draft, grade: $('grade').value, subject: $('subject').value, scope: $('scope').value.trim() });
        $('examLink').innerText = new URL('index.html?exam_id=' + r.id, location.href).href;
        $('linkBox').classList.remove('hide'); msg.className = 'status okmsg'; msg.innerText = '🎉 已發布！請複製連結傳給小朋友。'; loadExams();
      } catch (e) { msg.className = 'status err'; msg.innerText = '發布失敗：' + e.message; }
      btn.disabled = false;
    };
    $('copyBtn').onclick = () => navigator.clipboard.writeText($('examLink').innerText).then(() => { $('copyBtn').innerText = '已複製'; });

    // ---------- 成績 ----------
    function card(r, i) {
      const cls = r.ok ? 'okq' : (r.got > 0 ? 'midq' : 'badq'), icon = r.ok ? '✅' : (r.got > 0 ? '🟡' : '❌');
      let body = '';
      if (r.type === 'blank') {
        body = '<div>' + String(r.template).split('[blank]').map((p, j) => esc(p) + (j < r.correct.length
          ? `<span class="${String(r.given[j] || '').trim() === String(r.correct[j]).trim() ? 'ok' : 'bad'}">${esc(r.given[j] || '（空白）')}</span>` : '')).join('') + '</div>';
        if (!r.ok) body += `<div>正確答案：<b>${esc(r.correct.join('、'))}</b></div>`;
      } else if (r.type === 'mc') {
        body = r.options.map((o, j) => `<div>${L[j]}. ${esc(o)} ${j === r.given ? '👈 作答' : ''} ${j === r.correct ? '✔ 正確' : ''}</div>`).join('');
      } else body = `<div>作答：${esc(r.given || '（空白）')}</div><div>參考答案：<b>${esc(r.correct)}</b></div>`;
      return `<div class="qd ${cls}"><div><b>第 ${i + 1} 題 ${icon}</b> ${qt(r.question)} <span class="muted">(${r.got}/${r.max})</span></div>${body}` +
        (r.comment ? `<div class="muted">講評：${esc(r.comment)}</div>` : '') + (r.explain ? `<div class="muted">解析：${esc(r.explain)}</div>` : '') + '</div>';
    }
    // 相容舊格式資料
    function legacy(a) {
      if (!a || typeof a !== 'object') return [];
      return Object.keys(a).sort((x, y) => parseInt(x.slice(2)) - parseInt(y.slice(2))).map(k => {
        const q = a[k];
        if (Array.isArray(q)) return { type: 'short', question: '（舊格式資料）', given: q.join('、'), correct: '—', ok: false, got: 0, max: 0, explain: '' };
        return { type: 'blank', question: q.question, template: q.template, given: q.given, correct: q.correct, ok: q.ok, got: q.ok ? 1 : 0, max: 1, explain: q.explain };
      });
    }
    let resultRows = [];
    async function loadResults() {
      const box = $('results'); box.textContent = '載入中...';
      try {
        const { rows, names } = await call({ action: 'results' });
        resultRows = rows;
        if (!rows.length) { box.innerHTML = '<div class="muted">目前還沒有人繳交考卷。</div>'; return; }
        box.innerHTML = rows.map((r, i) => {
          const cls = r.score >= 80 ? 'good' : r.score >= 60 ? 'mid' : 'low';
          const items = Array.isArray(r.answers) ? r.answers : legacy(r.answers);
          return `<div class="rec"><div class="rec-head" onclick="var d=document.getElementById('d${i}');d.style.display=d.style.display==='block'?'none':'block'">
            <div><b>${esc(r.student_name || '（未填姓名）')}</b><br><span class="muted">${esc(names[r.exam_id] || r.exam_id)} · ${esc(new Date(r.created_at).toLocaleString('zh-TW'))}</span></div>
            <div style="display:flex;align-items:center;gap:8px"><div class="score ${cls}">${esc(r.score)} 分</div><button class="btn-sm btn-del" onclick="event.stopPropagation();delResult(${i})">刪除</button></div></div>
            <div class="detail" id="d${i}">${items.map(card).join('') || '<div class="muted">沒有作答內容。</div>'}</div></div>`;
        }).join('');
      } catch (e) { box.innerHTML = '<div class="err">讀取失敗：' + esc(e.message) + '</div>'; }
    }
    $('refreshBtn').onclick = loadResults;

    // ---------- 刪除成績 ----------
    async function delResult(i) {
      const r = resultRows[i];
      if (!r) return;
      if (!confirm('確定要刪除「' + (r.student_name || '（未填姓名）') + '」這筆成績（' + r.score + ' 分）嗎？刪除後無法復原。')) return;
      try { await call({ action: 'result_delete', id: r.id }); await loadResults(); }
      catch (e) { alert('刪除失敗：' + e.message); }
    }
    $('clearBtn').onclick = async () => {
      if (!resultRows.length) { alert('目前沒有成績可以清除。'); return; }
      if (!confirm('確定要清除全部 ' + resultRows.length + ' 筆成績嗎？刪除後無法復原。')) return;
      if (!confirm('再確認一次：真的要全部清除嗎？（已發布的考卷不會被刪除）')) return;
      try { await call({ action: 'results_clear' }); await loadResults(); }
      catch (e) { alert('清除失敗：' + e.message); }
    };

    // ---------- 已發布的考卷 ----------
    let examRows = [];
    function fullQ(q, i) {
      let body = '';
      if (q.type === 'blank') body = `<div>${qt(q.template)}</div><div>答案：<b>${esc((q.answer || []).join('、'))}</b></div>`;
      else if (q.type === 'mc') body = (q.options || []).map((o, j) => `<div>${L[j]}. ${esc(o)} ${j === q.answer ? '✔' : ''}</div>`).join('');
      else body = `<div>參考答案：<b>${esc(q.answer)}</b></div>`;
      return `<div class="qd"><div><b>${i + 1}. ${qt(q.q)}</b> <span class="muted">[${{ blank: '填空', mc: '選擇', short: '簡答' }[q.type]}]</span></div>${body}${q.explain ? `<div class="muted">解析：${esc(q.explain)}</div>` : ''}</div>`;
    }
    async function loadExams() {
      const box = $('examsBox'); box.textContent = '載入中...';
      try {
        const { exams } = await call({ action: 'exams_list' });
        examRows = exams;
        if (!exams.length) { box.innerHTML = '<div class="muted">還沒有發布過考卷。</div>'; return; }
        box.innerHTML = exams.map((e, i) => `<div class="rec"><div class="rec-head" onclick="openExam(${i})">
          <div><b>${esc(e.title)}</b><br><span class="muted">${esc(e.grade)} ${esc(e.subject)}${e.count ? ' · ' + e.count + ' 題' : ''}${e.created_at ? ' · ' + esc(new Date(e.created_at).toLocaleString('zh-TW')) : ''}</span></div>
          <button class="btn-sm" onclick="event.stopPropagation();copyExam(${i}, this)">複製連結</button></div>
          <div class="detail" id="e${i}"></div></div>`).join('');
      } catch (e) { box.innerHTML = '<div class="err">讀取失敗：' + esc(e.message) + '</div>'; }
    }
    function examLinkOf(i) { return new URL('index.html?exam_id=' + examRows[i].id, location.href).href; }
    function copyExam(i, btn) { navigator.clipboard.writeText(examLinkOf(i)).then(() => { btn.innerText = '已複製'; }); }
    async function openExam(i) {
      const d = $('e' + i);
      if (d.style.display === 'block') { d.style.display = 'none'; return; }
      d.style.display = 'block';
      if (d.dataset.loaded) return;
      d.innerHTML = '<div class="muted">載入中...</div>';
      try {
        const x = await call({ action: 'exam_full', exam_id: examRows[i].id });
        d.innerHTML = (x.scope ? `<div class="muted" style="margin-bottom:8px">範圍：${esc(x.scope)}</div>` : '') + x.items.map(fullQ).join('');
        d.dataset.loaded = '1';
      } catch (e) { d.innerHTML = '<div class="err">讀取失敗：' + esc(e.message) + '</div>'; }
    }
    $('examsRefresh').onclick = loadExams;
  </script>
</body>
</html>
